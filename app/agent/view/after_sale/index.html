{extend name="layout" /}

{block name="title"}售后管理{/block}
{block name="crumb"}订单管理 / <b>售后管理</b>{/block}

{block name="content"}
<div class="readonly-tip"><span>🔒</span><span><b>数据范围</b>：仅包含您团队卖家店铺订单的售后单（团队会员在别人店铺的售后不在此列）。同意退款会把货款退还买家，并从卖家余额中扣回该笔成交收入，请谨慎操作。</span></div>
<div class="search-bar">
    <div class="search-input">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input type="text" class="form-control" id="keyword" placeholder="订单号 / 商品标题 / 买家账号">
    </div>
    <select class="form-control" id="status">
        <option value="">全部状态</option>
        <option value="0">待处理</option>
        <option value="1">已同意退款</option>
        <option value="2">已驳回</option>
    </select>
    <button class="btn btn-primary" onclick="loadList(1)">查询</button>
    <button class="btn" onclick="resetSearch()">重置</button>
</div>

<div class="card">
    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th><th>订单号</th><th>商品</th><th>买家</th><th>卖家</th>
                <th>退款金额</th><th>售后理由</th><th>状态</th><th>申请时间</th><th>操作</th>
            </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
    <div class="pagination" id="pagination"></div>
</div>

<script>
var statusMap = {
    0: ['待处理','tag-orange'], 1: ['已同意退款','tag-green'], 2: ['已驳回','tag-gray']
};

function loadList(page){
    fetch('/agent/after_sale/index?page=' + page + '&limit=15'
        + '&keyword=' + encodeURIComponent(document.getElementById('keyword').value)
        + '&status=' + document.getElementById('status').value, {headers:{'X-Requested-With':'XMLHttpRequest'}})
        .then(function(r){ return r.json(); })
        .then(function(res){
            var html = '';
            if(!res.data || !res.data.length){
                html = '<tr><td colspan="10" class="empty">暂无数据</td></tr>';
            } else {
                res.data.forEach(function(a){
                    var st = statusMap[a.status] || ['未知','tag-gray'];
                    html += '<tr>'
                        + '<td>' + a.id + '</td>'
                        + '<td>' + esc(a.order_no) + '</td>'
                        + '<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + esc(a.goods_title) + '">' + esc(a.goods_title) + '</td>'
                        + '<td>' + esc(a.buyer_mobile || a.buyer_name || ('ID:' + a.user_id)) + '</td>'
                        + '<td>' + esc(a.seller_mobile || a.seller_name || ('ID:' + a.seller_id)) + '</td>'
                        + '<td class="price">￥' + a.price + '</td>'
                        + '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + esc(a.reason) + '">' + esc(a.reason) + '</td>'
                        + '<td><span class="tag ' + st[1] + '">' + st[0] + '</span></td>'
                        + '<td>' + (a.create_time ? fmtTime(a.create_time) : '-') + '</td>'
                        + '<td><a class="btn btn-sm" href="/agent/after_sale/detail?id=' + a.id + '">详情/处理</a></td></tr>';
                });
            }
            document.getElementById('tbody').innerHTML = html;
            renderPagination(res.count, page);
        });
}

function renderPagination(total, page){
    var pages = Math.ceil(total / 15) || 1;
    var html = '<span class="info">共 ' + total + ' 条，第 ' + page + '/' + pages + ' 页</span> ';
    html += '<a class="' + (page <= 1 ? 'disabled' : '') + '" href="javascript:;" onclick="loadList(1)">首页</a>';
    html += '<a class="' + (page <= 1 ? 'disabled' : '') + '" href="javascript:;" onclick="loadList(' + (page - 1) + ')">上一页</a>';
    var start = Math.max(1, page - 2), end = Math.min(pages, page + 2);
    for(var i = start; i <= end; i++){
        html += i == page ? '<span class="current">' + i + '</span>' : '<a href="javascript:;" onclick="loadList(' + i + ')">' + i + '</a>';
    }
    html += '<a class="' + (page >= pages ? 'disabled' : '') + '" href="javascript:;" onclick="loadList(' + (page + 1) + ')">下一页</a>';
    html += '<a class="' + (page >= pages ? 'disabled' : '') + '" href="javascript:;" onclick="loadList(' + pages + ')">末页</a>';
    document.getElementById('pagination').innerHTML = html;
}

function resetSearch(){
    document.getElementById('keyword').value = '';
    document.getElementById('status').value = '';
    loadList(1);
}

function fmtTime(ts){
    var d = new Date(ts * 1000);
    function p(n){ return n < 10 ? '0' + n : n; }
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

loadList(1);
</script>
{/block}

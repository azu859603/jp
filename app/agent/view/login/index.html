<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代理登录 - {$site_name|default=''}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",Arial,sans-serif;background:linear-gradient(135deg,#1e3a8a 0%,#0f172a 100%);display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{width:400px;max-width:92%;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:40px 36px}
.login-title{text-align:center;font-size:22px;font-weight:bold;color:#1e293b;margin-bottom:6px}
.login-sub{text-align:center;font-size:13px;color:#94a3b8;margin-bottom:26px}
.login-sub span{color:#2563eb}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;color:#475569;margin-bottom:6px}
.form-control{width:100%;padding:11px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;transition:border .2s}
.form-control:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.captcha-row{display:flex;gap:10px}
.captcha-row .form-control{flex:1}
.captcha-row img{height:42px;border-radius:8px;cursor:pointer;border:1px solid #e2e8f0}
.btn-login{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;transition:background .2s;font-weight:bold}
.btn-login:hover{background:#1d4ed8}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.error-tip{color:#dc2626;font-size:13px;text-align:center;margin-bottom:12px;display:none}
.notice-tip{background:#fff7ed;border:1px solid #fed7aa;color:#c2410c;font-size:12.5px;line-height:1.6;border-radius:8px;padding:10px 12px;margin-bottom:18px}
.links{text-align:center;margin-top:18px;font-size:12.5px;color:#94a3b8}
.links a{color:#2563eb;text-decoration:none}
.links a:hover{text-decoration:underline}
.footer{text-align:center;margin-top:20px;font-size:12px;color:#cbd5e1}
</style>
</head>
<body>
<div class="login-box">
    <div class="login-title">🤝 代理中心</div>
    <div class="login-sub"><span>{$site_name|default=''}</span></div>

    {if !empty($notice)}
    <div class="notice-tip">{$notice}</div>
    {/if}

    <div class="error-tip" id="errorTip"></div>
    <form id="loginForm" onsubmit="return doLogin();">
        <div class="form-group">
            <label>手机号</label>
            <input type="tel" maxlength="11" class="form-control" id="mobile" placeholder="请输入代理账号手机号" autocomplete="off">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" class="form-control" id="password" placeholder="请输入密码">
        </div>
        <div class="form-group">
            <label>验证码</label>
            <div class="captcha-row">
                <input type="text" class="form-control" id="captcha" maxlength="4" placeholder="请输入验证码" autocomplete="off">
                <img src="/agent/login/captcha" alt="验证码" onclick="this.src='/agent/login/captcha?'+Math.random()" title="点击刷新">
            </div>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">登 录</button>
    </form>

    <div class="links">
        代理账号即前台会员账号 · <a href="/">返回商城首页</a>
    </div>
</div>
<div class="footer">{$site_name|default=''} 代理中心</div>
<script>
function doLogin(){
    var btn = document.getElementById('loginBtn');
    var tip = document.getElementById('errorTip');
    tip.style.display = 'none';

    var data = {
        mobile: document.getElementById('mobile').value.trim(),
        password: document.getElementById('password').value,
        captcha: document.getElementById('captcha').value.trim()
    };
    if(!data.mobile || !data.password){ return showErr('请输入手机号和密码'); }
    if(!data.captcha){ return showErr('请输入验证码'); }

    btn.disabled = true;
    btn.textContent = '登录中...';
    var fd = new FormData();
    for(var k in data) fd.append(k, data[k]);

    fetch('/agent/login/doLogin', {method:'POST', headers:{'X-Requested-With':'XMLHttpRequest'}, body:fd})
        .then(function(r){ return r.json(); })
        .then(function(res){
            btn.disabled = false;
            btn.textContent = '登 录';
            if(res.code == 1){
                location.href = res.url || '/agent/index/index';
            } else {
                showErr(res.msg || '登录失败');
                refreshCaptcha();
            }
        })
        .catch(function(){
            btn.disabled = false;
            btn.textContent = '登 录';
            showErr('网络错误，请重试');
            refreshCaptcha();
        });
    return false;
}

function showErr(msg){
    var tip = document.getElementById('errorTip');
    tip.textContent = msg;
    tip.style.display = 'block';
    return false;
}

// 验证码是一次性的，每次提交后必须换新
function refreshCaptcha(){
    document.getElementById('captcha').value = '';
    document.querySelector('.captcha-row img').src = '/agent/login/captcha?' + Math.random();
}
</script>
</body>
</html>

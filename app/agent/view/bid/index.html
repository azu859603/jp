{extend name="layout" /}

{block name="title"}出价记录{/block}
{block name="crumb"}竞拍管理 / <b>出价记录</b>{/block}

{block name="content"}
<style>
.picker{position:relative}
.picker-list{background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.08);max-height:230px;overflow-y:auto;display:none;margin-top:4px}
#bidAddMask .dialog{width:560px}
.picker-list.show{display:block}
.picker-item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:10px}
.picker-item:last-child{border-bottom:0}
.picker-item:hover,.picker-item.active{background:#fff3e6}
.picker-item img{width:36px;height:36px;border-radius:6px;object-fit:cover;background:#f1f5f9;flex:none}
.picker-item .pi-main{flex:1;min-width:0}
.picker-item .pi-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1e293b}
.picker-item .pi-sub{font-size:12px;color:#94a3b8;margin-top:2px}
.picker-item .pi-id{font-size:12px;color:#ff7a00;font-family:Consolas,monospace;flex:none}
.picker-empty{padding:14px;text-align:center;color:#94a3b8;font-size:12px}
.picker-sel{margin-top:6px;font-size:12px;color:#16a34a;min-height:16px}
.picker-sel b{color:#1e293b}
.picker-sel a{color:#94a3b8;margin-left:8px}
</style>
<div class="readonly-tip"><span>🔒</span><span><b>数据范围</b>：仅包含您团队卖家发布的拍品上的出价，以及您团队会员参与的出价。添加出价只能选择团队内的拍品和买家。</span></div>
<div class="search-bar">
    <div class="search-input">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input type="text" class="form-control" id="keyword" placeholder="拍品标题 / 会员手机号 / 昵称">
    </div>
    <button class="btn btn-primary" onclick="loadList(1)">查询</button>
    <button class="btn" onclick="resetSearch()">重置</button>
    <button class="btn btn-primary" onclick="openBidAdd()">添加出价</button>
</div>

<div class="card">
    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th><th>拍品</th><th>出价人</th><th>出价金额</th><th>状态</th><th>是否得标</th><th>归属</th><th>时间</th>
            </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
    <div class="pagination" id="pagination"></div>
</div>

<!-- 手动添加出价弹窗 -->
<div class="mask" id="bidAddMask">
    <div class="dialog">
        <div class="dialog-title">手动添加出价</div>
        <div class="dialog-body">
            <div class="form-group" style="margin-bottom:12px;">
                <label>拍品 <span class="tip" style="display:inline">（输入拍品 ID 或标题关键词，只列团队卖家拍卖中的拍品）</span></label>
                <div class="picker" id="goodsPicker">
                    <input type="text" class="form-control" id="goodsKw" placeholder="拍品 ID / 标题关键词" autocomplete="off">
                    <input type="hidden" id="addGoods" value="">
                    <div class="picker-list" id="goodsList"></div>
                </div>
                <div class="picker-sel" id="goodsSel"></div>
            </div>
            <div class="form-group" style="margin-bottom:12px;">
                <label>买家 <span class="tip" style="display:inline">（输入手机号、昵称或会员 ID，只列团队内会员）</span></label>
                <div class="picker" id="userPicker">
                    <input type="text" class="form-control" id="userKw" placeholder="手机号 / 昵称 / 会员 ID" autocomplete="off">
                    <input type="hidden" id="addUser" value="">
                    <div class="picker-list" id="userList"></div>
                </div>
                <div class="picker-sel" id="userSel"></div>
            </div>
            <div class="form-group" style="margin-bottom:12px;">
                <label>出价金额（元）</label>
                <input class="form-control" type="number" id="addPrice" min="0.01" step="0.01" placeholder="须高于当前最高价且按加价幅度递增">
            </div>
            <div id="addTip" style="font-size:12px;color:#999;"></div>
        </div>
        <div class="dialog-footer">
            <button class="btn" onclick="closeBidAdd()">取消</button>
            <button class="btn btn-primary" onclick="doBidAdd()">确定添加</button>
        </div>
    </div>
</div>

<script>
function loadList(page){
    fetch('/agent/bid/index?page=' + page + '&limit=15&keyword=' + encodeURIComponent(document.getElementById('keyword').value), {headers:{'X-Requested-With':'XMLHttpRequest'}})
        .then(function(r){ return r.json(); })
        .then(function(res){
            var html = '';
            if(!res.data || !res.data.length){
                html = '<tr><td colspan="8" class="empty">暂无数据</td></tr>';
            } else {
                res.data.forEach(function(b){
                    var stHtml = b.status == 1 ? '<span class="tag tag-green">成交</span>'
                        : (b.status == 2 ? '<span class="tag tag-gray">流拍退回</span>' : '<span class="tag tag-blue">竞拍中</span>');
                    var winHtml = b.is_winner == 1 ? '<span class="tag tag-green">得标</span>' : '<span class="tag tag-gray">-</span>';
                    html += '<tr>'
                        + '<td>' + b.id + '</td>'
                        + '<td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + b.goods_title + '">' + (b.goods_title || '商品#' + b.goods_id) + '</td>'
                        + '<td>' + (b.nickname || b.mobile || ('ID:' + b.user_id)) + '</td>'
                        + '<td class="price">￥' + b.price + '</td>'
                        + '<td>' + stHtml + '</td>'
                        + '<td>' + winHtml + '</td>'
                        + '<td>' + (b.seller_in_team == 1 ? '<span class="tag tag-orange">团队拍品</span> ' : '') + (b.buyer_in_team == 1 ? '<span class="tag tag-blue">团队买家</span>' : '') + '</td>'
                        + '<td>' + fmtTime(b.create_time) + '</td></tr>';
                });
            }
            document.getElementById('tbody').innerHTML = html;
            renderPagination(res.count, page);
        });
}

function renderPagination(total, page){
    var pages = Math.ceil(total / 15) || 1;
    var html = '<span class="info">共 ' + total + ' 条，第 ' + page + '/' + pages + ' 页</span> ';
    html += '<a class="' + (page <= 1 ? 'disabled' : '') + '" href="javascript:;" onclick="loadList(1)">首页</a>';
    html += '<a class="' + (page <= 1 ? 'disabled' : '') + '" href="javascript:;" onclick="loadList(' + (page - 1) + ')">上一页</a>';
    var start = Math.max(1, page - 2), end = Math.min(pages, page + 2);
    for(var i = start; i <= end; i++){
        html += i == page ? '<span class="current">' + i + '</span>' : '<a href="javascript:;" onclick="loadList(' + i + ')">' + i + '</a>';
    }
    html += '<a class="' + (page >= pages ? 'disabled' : '') + '" href="javascript:;" onclick="loadList(' + (page + 1) + ')">下一页</a>';
    html += '<a class="' + (page >= pages ? 'disabled' : '') + '" href="javascript:;" onclick="loadList(' + pages + ')">末页</a>';
    document.getElementById('pagination').innerHTML = html;
}

function resetSearch(){
    document.getElementById('keyword').value = '';
    loadList(1);
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* 可搜索选择器：输入关键词 → 请求接口 → 下拉列表点击选中 */
function makePicker(opt){
    var kw = document.getElementById(opt.kw), hid = document.getElementById(opt.hidden),
        list = document.getElementById(opt.list), sel = document.getElementById(opt.sel);
    var timer = null, items = [], active = -1;
    function render(){
        if(!items.length){ list.innerHTML = '<div class="picker-empty">' + (kw.value.trim() ? '没有匹配的结果' : '输入关键词开始搜索') + '</div>'; list.classList.add('show'); return; }
        list.innerHTML = items.map(function(it, i){ return '<div class="picker-item' + (i === active ? ' active' : '') + '" data-i="' + i + '">' + opt.row(it) + '</div>'; }).join('');
        list.classList.add('show');
    }
    function search(){
        var q = kw.value.trim();
        fetch(opt.url + '?kw=' + encodeURIComponent(q), {headers:{'X-Requested-With':'XMLHttpRequest'}})
            .then(function(r){ return r.json(); })
            .then(function(res){ if(kw.value.trim() !== q) return; items = res.data || []; active = -1; render(); })
            .catch(function(){ items = []; render(); });
    }
    function choose(i){
        var it = items[i]; if(!it) return;
        hid.value = it.id; kw.value = opt.text(it);
        sel.innerHTML = '已选：<b>' + esc(opt.text(it)) + '</b><a href="javascript:;" data-clear="1">清除</a>';
        list.classList.remove('show');
        if(opt.onPick) opt.onPick(it);
    }
    function clear(){ hid.value = ''; kw.value = ''; sel.innerHTML = ''; items = []; list.classList.remove('show'); if(opt.onClear) opt.onClear(); }
    kw.addEventListener('input', function(){ hid.value = ''; sel.innerHTML = ''; if(opt.onClear) opt.onClear(); clearTimeout(timer); timer = setTimeout(search, 250); });
    kw.addEventListener('focus', function(){ if(!hid.value){ clearTimeout(timer); timer = setTimeout(search, 100); } });
    kw.addEventListener('keydown', function(e){
        if(!list.classList.contains('show')) return;
        if(e.key === 'ArrowDown'){ active = Math.min(items.length - 1, active + 1); render(); e.preventDefault(); }
        else if(e.key === 'ArrowUp'){ active = Math.max(0, active - 1); render(); e.preventDefault(); }
        else if(e.key === 'Enter'){ if(active >= 0) choose(active); else if(items.length === 1) choose(0); e.preventDefault(); }
        else if(e.key === 'Escape'){ list.classList.remove('show'); }
    });
    list.addEventListener('mousedown', function(e){ var it = e.target.closest('.picker-item'); if(it){ e.preventDefault(); choose(parseInt(it.getAttribute('data-i'))); } });
    sel.addEventListener('click', function(e){ if(e.target.getAttribute('data-clear')) clear(); });
    document.addEventListener('click', function(e){ if(!e.target.closest('#' + opt.kw) && !e.target.closest('#' + opt.list)) list.classList.remove('show'); });
    return {clear: clear};
}

var goodsPicker, userPicker, pickedGoods = null;
function showGoodsTip(g){
    var tip = document.getElementById('addTip'), price = document.getElementById('addPrice');
    if(!g){ tip.innerHTML = ''; price.value = ''; return; }
    var top = parseFloat(g.top_price) || 0, raise = parseFloat(g.raise_price) || 1;
    if(raise <= 0) raise = 1;
    var min = top + raise;
    tip.innerHTML = '当前最高价 ¥' + top.toFixed(2) + '，加价幅度 ¥' + raise.toFixed(2) + '，最低可出 ¥' + min.toFixed(2) + '，截拍 ' + esc(g.end_text);
    price.value = min.toFixed(2);
}
function initPickers(){
    goodsPicker = makePicker({
        kw: 'goodsKw', hidden: 'addGoods', list: 'goodsList', sel: 'goodsSel', url: '/agent/bid/searchGoods',
        row: function(g){ return '<img src="' + esc(g.cover || '') + '" onerror="this.style.visibility=\'hidden\'"><div class="pi-main"><div class="pi-title">' + esc(g.title) + '</div><div class="pi-sub">' + (g.seller_name ? esc(g.seller_name) + ' · ' : '') + '当前价 ¥' + (parseFloat(g.top_price)||0).toFixed(2) + ' · 加价 ¥' + (parseFloat(g.raise_price)||0).toFixed(2) + ' · ' + (g.bid_count||0) + ' 次出价 · 截拍 ' + esc(g.end_text) + '</div></div><span class="pi-id">ID ' + g.id + '</span>'; },
        text: function(g){ return '[' + g.id + '] ' + g.title; },
        onPick: function(g){ pickedGoods = g; showGoodsTip(g); },
        onClear: function(){ pickedGoods = null; showGoodsTip(null); }
    });
    userPicker = makePicker({
        kw: 'userKw', hidden: 'addUser', list: 'userList', sel: 'userSel', url: '/agent/bid/searchUser',
        row: function(u){ return '<div class="pi-main"><div class="pi-title">' + esc(u.nickname || '-') + (u.is_virtual == 1 ? ' <span class="tag tag-purple">虚拟会员</span>' : ' <span class="tag tag-green">正常会员</span>') + '</div><div class="pi-sub">' + esc(u.mobile) + ' · 余额 ¥' + (parseFloat(u.balance)||0).toFixed(2) + '</div></div><span class="pi-id">ID ' + u.id + '</span>'; },
        text: function(u){ return (u.nickname || u.mobile) + (u.is_virtual == 1 ? '【虚拟会员】' : '【正常会员】') + '（' + u.mobile + '）'; }
    });
}
function openBidAdd(){
    if(!goodsPicker) initPickers();
    goodsPicker.clear(); userPicker.clear();
    document.getElementById('addPrice').value = '';
    document.getElementById('addTip').innerHTML = '';
    document.getElementById('bidAddMask').classList.add('show');
    setTimeout(function(){ document.getElementById('goodsKw').focus(); }, 50);
}
function closeBidAdd(){
    document.getElementById('bidAddMask').classList.remove('show');
}
function doBidAdd(){
    var goodsId = document.getElementById('addGoods').value;
    var userId = document.getElementById('addUser').value;
    var price = document.getElementById('addPrice').value;
    if(!goodsId){ alert('请先搜索并选择拍品'); return; }
    if(!userId){ alert('请先搜索并选择买家'); return; }
    if(!price || parseFloat(price) <= 0){ alert('请填写出价金额'); return; }
    ajaxPost('/agent/bid/add', {goods_id: goodsId, user_id: userId, price: price}, function(res){
        alert(res.msg);
        if(res.code == 1){ closeBidAdd(); loadList(1); }
    });
}

function fmtTime(ts){
    var d = new Date(ts * 1000);
    function p(n){ return n < 10 ? '0' + n : n; }
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

loadList(1);
</script>
{/block}

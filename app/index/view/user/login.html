{extend name="layout" /}
{block name="header"}{/block}
{block name="content"}
<div class="login-hero">
    <div class="login-card">
        <h2 class="lc-title">{:lang('登录账户')}</h2>
        <div class="lc-group">
            <label class="lc-label" for="mobile">{:lang('手机号码')}</label>
            <input class="lc-input" type="tel" id="mobile" maxlength="11" placeholder="" value="">
        </div>
        <div class="lc-group">
            <label class="lc-label" for="password">{:lang('密码')}</label>
            <div class="lc-pwd-wrap">
                <input class="lc-input" type="password" id="password" placeholder="">
                <span class="lc-eye" onclick="togglePwd()">
                    <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                </span>
            </div>
        </div>
        <button class="lc-btn" onclick="doLogin()">{:lang('登入')}</button>
        <div class="lc-sub">{:lang('没有账户？')}<a href="/user/register">{:lang('建立账户')}</a></div>
        <div class="lc-agree">
            {:lang('登录即代表同意')}<a href="/user/agreement?type=protocol">{:lang('《用户协议》')}</a>{:lang('和')}<a href="/user/agreement?type=privacy">{:lang('《隐私政策》')}</a>
        </div>
    </div>
</div>
<style>
.page{padding-top:0!important;padding-bottom:0!important;}
.login-hero{
    min-height:100vh;
    background:url('/static/images/login-bg.jpg?v-3') no-repeat;
    background-size:auto 100%;
    padding:50% 16px 60px;
    box-sizing:border-box;
}
.login-card{
    background:#fff;
    padding:32px;
    box-sizing:border-box;
}
.lc-title{
    font-size:28px;
    font-weight:700;
    color:#1e2123;
    line-height:1.5;
    margin:0 0 20px;
}
.lc-group{margin-bottom:16px;}
.lc-label{
    display:block;
    font-size:16px;
    color:#525252;
    margin-bottom:8px;
}
.lc-input{
    display:block;
    width:100%;
    height:38px;
    padding:6px 12px;
    box-sizing:border-box;
    border:1px solid #525252;
    border-radius:4px;
    font-size:16px;
    color:#1e2123;
    background:#fff;
    outline:none;
    -webkit-appearance:none;
}
.lc-input:focus{border-color:#bf9d5a;}
.lc-pwd-wrap{position:relative;}
.lc-pwd-wrap .lc-input{padding-right:40px;}
.lc-eye{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    width:22px;
    height:22px;
    color:#8a8a8a;
    cursor:pointer;
}
.lc-eye svg{width:100%;height:100%;}
.lc-btn{
    display:block;
    width:100%;
    height:38px;
    margin-top:24px;
    background:#bf9d5a;
    border:1px solid #bf9d5a;
    border-radius:4px;
    color:#fff;
    font-size:14px;
    letter-spacing:2px;
    cursor:pointer;
}
.lc-btn:active{opacity:.85;}
.lc-sub{
    margin-top:16px;
    font-size:15px;
    color:#525252;
}
.lc-sub a{color:#bf9d5a;text-decoration:underline;}
.lc-agree{
    margin-top:18px;
    font-size:12px;
    color:#9a9a9a;
    line-height:1.6;
}
.lc-agree a{color:#bf9d5a;}
</style>
{/block}
{block name="tabbar"}

{/block}
{block name="script"}
<script>
function doLogin() {
    var mobile = document.getElementById('mobile').value.trim();
    var password = document.getElementById('password').value.trim();
    if (!mobile || !password) { toast('请输入手机号和密码'); return; }
    ajaxPost('/user/doLogin', {mobile: mobile, password: password}, function(res){
        if (res.code === 1) {
            toast(res.msg);
            setTimeout(function(){ location.href = res.url || '/user/center'; }, 600);
        } else {
            toast(res.msg);
        }
    });
}
function togglePwd() {
    var input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
}
document.addEventListener('keydown', function(e){ if(e.keyCode==13) doLogin(); });
</script>
{/block}

{extend name="layout" /}
{block name="content"}
<style>
.ft-item{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid #f7f7f7;gap:10px;}
.ft-item .cover{width:64px;height:64px;border-radius:8px;object-fit:cover;background:#f5f5f5;flex-shrink:0;}
.ft-item .info{flex:1;min-width:0;}
.ft-item .t{font-size:13px;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ft-item .time{font-size:11px;color:#bbb;margin-top:4px;}
.ft-item .price{font-size:14px;color:#E4393C;font-weight:600;flex-shrink:0;}
.ft-item .st{font-size:10px;color:#fff;background:#ccc;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px;}
.ft-item .st.on{background:#E4393C;}
</style>
<div class="bid-list">
    <div class="b-head">我的足迹（{$list|count}）</div>
    {foreach $list as $v}
    <a class="ft-item" href="/goods/detail?id={$v.goods_id}">
        <img class="cover" src="{$v.cover}" onerror="this.src='/static/img/noimg.png'">
        <div class="info">
            <div class="t">{$v.title}</div>
            <div class="time">浏览于 {$v.create_time|date='m-d H:i'}</div>
        </div>
        <div class="price">¥{$v.cur_price|number_format=2}<span class="st {if $v.goods_status==1}on{/if}">{$v.status_txt}</span></div>
    </a>
    {/foreach}
    {if empty($list)}
    <div class="empty" style="padding:60px 0;">
        <div class="e-ico">👣</div>
        <div>还没有浏览记录</div>
        <a class="e-btn" href="/">去逛逛</a>
    </div>
    {/if}
</div>
{/block}

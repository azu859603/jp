{foreach $logs as $l}
<div class="wl-item">
    <div class="wl-ico {if $l.amount>0}in{else}out{/if}"><i></i></div>
    <div class="wl-info">
        <div class="wl-name">{$l.type_name}</div>
        <div class="wl-time">{$l.create_time|date='Y-m-d H:i:s'}</div>
    </div>
    <div class="wl-right">
        <div class="wl-amount {if $l.amount>0}in{else}out{/if}">{if $l.amount>0}+{/if}¥{$l.amount|number_format=2}</div>
        {if !empty($l.remark)}<span class="wl-tag" title="{$l.remark}">{$l.remark}</span>{/if}
    </div>
</div>
{/foreach}

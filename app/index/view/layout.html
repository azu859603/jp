<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="current-lang" content="{$current_lang}">
<title>{$page_title|default=$site_name} - {$site_name}</title>
<link rel="stylesheet" href="/static/m.css?v=20260830">
</head>
<body>
<div class="app">
{block name="header"}
{if empty($hide_header)}
<div class="hd">
    <a class="back" href="javascript:history.back(-1);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <span class="title">{$page_title|default=''}</span>
</div>
{/if}
{/block}

<div class="page {if !empty($hide_header)}no-hd{/if} {if !empty($hide_tabbar)}no-tabbar{/if} {if !empty($page_class)}{$page_class}{/if}">
    {block name="content"}{/block}
</div>

{block name="tabbar"}
{if empty($hide_tabbar)}
<div class="tabbar">
    <a href="/" {if $tab_active=='index'}class="on"{/if}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
        <span>{:lang('首页')}</span>
    </a>
    <a href="/category" {if $tab_active=='category'}class="on"{/if}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
        <span>{:lang('分类')}</span>
    </a>
    <a class="tab-pub" href="/seller/goods_add">
        <span class="pub-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </span>
        <span>{:lang('发布')}</span>
    </a>
    <a href="/user/center" {if $tab_active=='mine'}class="on"{/if}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg>
        <span>{:lang('我的')}</span>
    </a>
</div>
{/if}
{/block}
</div>
<script src="/static/i18n.js?v=20260820"></script>
<script src="/static/m.js?v=20260819"></script>
{block name="script"}{/block}
</body>
</html>

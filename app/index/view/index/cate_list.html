{extend name="layout" /}
{block name="title"}{$page_title}{/block}
{block name="content"}
<div id="cateWrap">
{include file="index/cate_list_items" /}
</div>
{/block}
{block name="script"}
<script>
// 分类拍品列表：加载更多为追加，不替换已有内容
var cateState = {
    category_id: {$category_id},
    page: {$page},
    loading: false
};

// 点击仍可触发，作为兜底；正常情况由 autoLoadMore 在上拉到底时自动调用
document.getElementById('cateWrap').addEventListener('click', function (e) {
    var link = e.target.closest ? e.target.closest('.load-more') : null;
    if (!link) return;
    e.preventDefault();
    loadMoreCate();
});

function loadMoreCate() {
    if (cateState.loading) return;
    cateState.loading = true;

    var wrap = document.getElementById('cateWrap');
    var link = wrap.querySelector('.load-more');
    var txtEl = link ? link.querySelector('.lm-txt') : null;
    var oldText = txtEl ? txtEl.textContent : '';
    if (link) link.classList.add('loading');
    if (txtEl) txtEl.textContent = txtEl.getAttribute('data-loading') || oldText;

    var next = cateState.page + 1;
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/category/list?category_id=' + cateState.category_id + '&page=' + next, true);
    xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
    xhr.onload = function () {
        cateState.loading = false;
        if (xhr.status !== 200) {
            if (link) link.classList.remove('loading');
            if (txtEl) txtEl.textContent = oldText;
            toast('加载失败，请重试');
            return;
        }
        // 去掉旧的「加载更多/没有更多」，把新卡片接到现有列表后面
        var old = wrap.querySelector('.load-more, .no-more');
        if (old) old.remove();

        var box = document.createElement('div');
        box.innerHTML = xhr.responseText;
        var newGrid = box.querySelector('.goods-grid');
        var grid = wrap.querySelector('.goods-grid');
        if (newGrid && grid) {
            while (newGrid.firstChild) grid.appendChild(newGrid.firstChild);
        }
        var tail = box.querySelector('.load-more, .no-more');
        if (tail) wrap.appendChild(tail);

        cateState.page = next;
        initCountdowns();   // 新插入的节点需要重新启动倒计时
    };
    xhr.onerror = function () {
        cateState.loading = false;
        if (link) link.classList.remove('loading');
        if (txtEl) txtEl.textContent = oldText;
        toast('网络异常，请重试');
    };
    xhr.send();
}

initCountdowns();
if (typeof autoLoadMore === 'function') autoLoadMore(document.getElementById('cateWrap'), loadMoreCate);
</script>
{/block}

{extend name="layout" /}

{block name="title"}订单列表{/block}
{block name="crumb"}订单管理 / <b>订单列表</b>{/block}

{block name="content"}
<div class="search-bar">
    <input type="text" class="form-control" id="keyword" placeholder="订单号 / 商品名称 / 卖家手机号 / 买家手机号">
    <select class="form-control" id="pay_status">
        <option value="">全部支付状态</option>
        <option value="0">未支付</option>
        <option value="1">已支付</option>
    </select>
    <select class="form-control" id="order_status">
        <option value="">全部订单状态</option>
        <option value="0">待付款</option>
        <option value="1">待发货</option>
        <option value="2">待收货</option>
        <option value="3">已完成</option>
        <option value="4">已取消</option>
        <option value="5">售后中</option>
    </select>
    <button class="btn btn-primary" onclick="loadList(1)">查询</button>
    <button class="btn" onclick="resetSearch()">重置</button>
</div>

<div class="card">
    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th><th>订单号</th><th>商品</th><th>买家</th><th>卖家</th>
                <th>成交价</th><th>佣金</th><th>支付</th><th>状态</th><th>创建时间</th><th>操作</th>
            </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
    <div class="pagination" id="pagination"></div>
</div>

<!-- 完成支付（代买家余额支付） -->
<div class="mask" id="payMask">
    <div class="dialog">
        <div class="dialog-title">完成支付</div>
        <div class="dialog-body">
            <div class="tip" id="payTip" style="margin:0 0 10px;line-height:1.7;"></div>
            <div class="form-group"><label>收货人 <span class="req">*</span></label><input type="text" class="form-control" id="payShipName"></div>
            <div class="form-group"><label>收货电话 <span class="req">*</span></label><input type="text" class="form-control" id="payShipMobile"></div>
            <div class="form-group"><label>收货地址 <span class="req">*</span></label><input type="text" class="form-control" id="payShipAddress"></div>
            <div class="tip" style="color:#b45309;">代买家用其账户余额支付：应付 = 成交价 − 已冻结保证金；余额不足会提示，不会垫付。支付后订单转为待发货，成交款在买家确认收货后结算给卖家。</div>
        </div>
        <div class="dialog-footer">
            <button class="btn" onclick="document.getElementById('payMask').classList.remove('show')">取消</button>
            <button class="btn btn-primary" id="payBtn" onclick="doPay()">确认支付</button>
        </div>
    </div>
</div>
<script>
var currentPage = 1;
var orderStatusMap = {
    0: ['待付款','tag-orange'], 1: ['待发货','tag-blue'], 2: ['待收货','tag-purple'],
    3: ['已完成','tag-green'], 4: ['已取消','tag-gray'], 5: ['售后中','tag-red']
};

function loadList(page){
    currentPage = page;
    fetch('/admin1314/order/index?page=' + page + '&limit=15'
        + '&keyword=' + encodeURIComponent(document.getElementById('keyword').value)
        + '&pay_status=' + document.getElementById('pay_status').value
        + '&order_status=' + document.getElementById('order_status').value, {headers:{'X-Requested-With':'XMLHttpRequest'}})
        .then(function(r){ return r.json(); })
        .then(function(res){
            var html = '';
            if(!res.data || !res.data.length){
                html = '<tr><td colspan="11" class="empty">暂无数据</td></tr>';
            } else {
                res.data.forEach(function(o){
                    var st = orderStatusMap[o.order_status] || ['未知','tag-gray'];
                    var payHtml = o.pay_status == 1 ? '<span class="tag tag-green">已支付</span>' : '<span class="tag tag-orange">未支付</span>';
                    html += '<tr>'
                        + '<td>' + o.id + '</td>'
                        + '<td>' + o.order_no + '</td>'
                        + '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + esc(o.goods_title) + '">' + esc(o.goods_title) + '</td>'
                        + '<td>' + esc(o.buyer_mobile || o.buyer_name || o.buyer_id) + (o.buyer_virtual == 1 ? '<div style="font-size:12px;color:#999;">（虚拟会员）</div>' : '') + '</td>'
                        + '<td>' + esc(o.seller_mobile || o.seller_name || o.seller_id) + '</td>'
                        + '<td class="price">￥' + o.price + '</td>'
                        + '<td>￥' + o.commission + '</td>'
                        + '<td>' + payHtml + '</td>'
                        + '<td><span class="tag ' + st[1] + '">' + st[0] + '</span></td>'
                        + '<td>' + (o.create_time ? fmtTime(o.create_time) : '-') + '</td>'
                        + '<td><a class="btn btn-sm" href="/admin1314/order/detail?id=' + o.id + '">详情</a>'
                        + (o.pay_status == 0 && o.order_status == 0 ? ' <a class="btn btn-sm btn-primary" href="javascript:;" onclick="openPay(' + o.id + ')">完成支付</a>' : '')
                        + '</td></tr>';
                });
            }
            document.getElementById('tbody').innerHTML = html;
            renderPagination(res.count, page);
        });
}

function renderPagination(total, page){
    var pages = Math.ceil(total / 15) || 1;
    var html = '<span class="info">共 ' + total + ' 条，第 ' + page + '/' + pages + ' 页</span> ';
    html += '<a class="' + (page <= 1 ? 'disabled' : '') + '" href="javascript:;" onclick="loadList(1)">首页</a>';
    html += '<a class="' + (page <= 1 ? 'disabled' : '') + '" href="javascript:;" onclick="loadList(' + (page - 1) + ')">上一页</a>';
    var start = Math.max(1, page - 2), end = Math.min(pages, page + 2);
    for(var i = start; i <= end; i++){
        html += i == page ? '<span class="current">' + i + '</span>' : '<a href="javascript:;" onclick="loadList(' + i + ')">' + i + '</a>';
    }
    html += '<a class="' + (page >= pages ? 'disabled' : '') + '" href="javascript:;" onclick="loadList(' + (page + 1) + ')">下一页</a>';
    html += '<a class="' + (page >= pages ? 'disabled' : '') + '" href="javascript:;" onclick="loadList(' + pages + ')">末页</a>';
    document.getElementById('pagination').innerHTML = html;
}

function resetSearch(){
    document.getElementById('keyword').value = '';
    document.getElementById('pay_status').value = '';
    document.getElementById('order_status').value = '';
    loadList(1);
}

function fmtTime(ts){
    var d = new Date(ts * 1000);
    function p(n){ return n < 10 ? '0' + n : n; }
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

loadList(1);
var PAY_BASE = '/admin1314';
// ---------- 完成支付 ----------
var payOrderId = 0, payVirtual = false;
function openPay(id){
    payOrderId = id;
    fetch(PAY_BASE + '/order/payInfo?id=' + id, {headers:{'X-Requested-With':'XMLHttpRequest'}})
        .then(function(r){ return r.json(); })
        .then(function(res){
            if (res.code != 1) { alert(res.msg || '加载失败'); return; }
            var d = res.data;
            document.getElementById('payTip').innerHTML =
                '订单 <b>' + esc(d.order_no) + '</b>　' + esc(d.goods_title) + '<br>'
                + '买家：' + esc(d.buyer) + '　当前余额 <b>￥' + d.buyer_balance + '</b><br>'
                + '成交价 ￥' + d.price + '　已冻结保证金 ￥' + d.deposit + '　<b>本次需从余额扣 ￥' + d.balance_need + '</b>'
                + (d.is_virtual == 1 ? '<br><span style="color:#2563eb;">买家是虚拟会员：不真实扣款，直接标记为已支付；收货信息仍需填写，供卖家发货</span>' : (d.enough ? '' : ' <span style="color:#dc2626;">（余额不足）</span>'));
            payVirtual = d.is_virtual == 1;
            document.getElementById('payShipName').value = d.ship_name || '';
            document.getElementById('payShipMobile').value = d.ship_mobile || '';
            document.getElementById('payShipAddress').value = d.ship_address || '';
            document.getElementById('payBtn').disabled = !d.enough;
            document.getElementById('payMask').classList.add('show');
        });
}
function doPay(){
    var data = {
        id: payOrderId,
        ship_name: document.getElementById('payShipName').value.trim(),
        ship_mobile: document.getElementById('payShipMobile').value.trim(),
        ship_address: document.getElementById('payShipAddress').value.trim()
    };
    if (!data.ship_name || !data.ship_mobile || !data.ship_address) { alert('请填写收货人、电话和地址'); return; }
    if (!confirm(payVirtual ? '买家是虚拟会员，将直接标记为已支付（不扣款），确认？' : '确认代买家用余额完成支付？')) return;
    ajaxPost(PAY_BASE + '/order/pay', data, function(res){
        alert(res.msg);
        if (res.code == 1) { document.getElementById('payMask').classList.remove('show'); loadList(typeof currentPage !== 'undefined' ? currentPage : 1); }
    });
}
</script>
{/block}

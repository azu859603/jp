<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>竞拍网站</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; background: #f5f6fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { text-align: center; background: #fff; padding: 60px 80px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
        h1 { color: #ff7a00; margin: 0 0 10px; }
        p { color: #999; }
        a { display: inline-block; margin-top: 20px; padding: 10px 30px; background: #ff7a00; color: #fff; text-decoration: none; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>竞拍网站</h1>
        <p>系统开发中，请先访问后台 /admin</p>
        <a href="/admin">进入后台</a>
    </div>
</body>
</html>

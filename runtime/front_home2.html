.logo{font-size:22px;font-weight:bold;color:#e64a19;margin-right:40px;white-space:nowrap;}
.logo span{color:#333;}

.nav a{padding:6px 2px;}
.nav a.active,.nav a:hover{color:#e64a19;font-weight:bold;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:14px;}
.search-box{display:flex;margin-left:20px;}
.search-box input{width:200px;height:34px;border:1px solid #ddd;border-radius:4px 0 0 4px;padding:0 10px;font-size:13px;outline:none;}
.search-box button{height:34px;padding:0 16px;background:#e64a19;color:#fff;border:0;border-radius:0 4px 4px 0;cursor:pointer;font-size:13px;}
.btn{display:inline-block;padding:8px 18px;border-radius:4px;font-size:14px;cursor:pointer;border:0;}
.btn-primary{background:#e64a19;color:#fff;}
.btn-primary:hover{background:#cf3f10;color:#fff;}
.btn-plain{background:#fff;border:1px solid #ddd;color:#333;}
.btn-plain:hover{border-color:#e64a19;color:#e64a19;}
.btn-danger{background:#f56c6c;color:#fff;}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-disabled{background:#ccc;color:#fff;cursor:not-allowed;}
.tag{display:inline-block;padding:1px 8px;border-radius:3px;font-size:12px;}
.tag-red{background:#fde2e2;color:#f56c6c;}
.tag-green{background:#e1f3d8;color:#67c23a;}
.tag-blue{background:#e1eefb;color:#409eff;}
.tag-orange{background:#fdf3e1;color:#e6a23c;}
.tag-gray{background:#f0f0f0;color:#999;}
.container{max-width:1200px;margin:20px auto;padding:0 16px;min-height:500px;}
.crumbs{color:#999;font-size:13px;margin-bottom:14px;}
.crumbs a{color:#e64a19;}
.footer{background:#fff;border-top:1px solid #eee;padding:24px 0;text-align:center;color:#999;font-size:13px;margin-top:40px;}
/* 首页商品卡 */
.goods-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.goods-card{background:#fff;border-radius:8px;overflow:hidden;transition:box-shadow .2s;border:1px solid #f0f0f0;}
.goods-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.1);}
.goods-cover{height:200px;background:#f7f7f7;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.goods-cover img{width:100%;height:100%;object-fit:cover;}
.goods-cover .no-img{color:#bbb;font-size:40px;}
.goods-info{padding:12px 14px;}
.goods-title{font-size:14px;height:40px;line-height:20px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.goods-price-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;}
.goods-price{color:#e64a19;font-size:20px;font-weight:bold;}
.goods-price small{font-size:12px;font-weight:normal;color:#999;}
.goods-end{font-size:12px;color:#999;text-align:right;}
.goods-end b{color:#e64a19;font-weight:normal;}
.goods-meta{display:flex;justify-content:space-between;font-size:12px;color:#999;margin-top:8px;padding-top:8px;border-top:1px dashed #eee;}

.pagination{display:flex;justify-content:center;gap:6px;margin:24px 0;}

.pagination .cur{background:#e64a19;color:#fff;border-color:#e64a19;}
.pagination .disable{color:#ccc;}
/* 表单 */

.form-panel h2{font-size:20px;text-align:center;margin-bottom:24px;}
.form-item{margin-bottom:16px;}
.form-item label{display:block;font-size:13px;color:#666;margin-bottom:6px;}

.form-link{text-align:center;font-size:13px;color:#999;margin-top:14px;}

.captcha-row{display:flex;gap:10px;}
.captcha-row input{flex:1;}
.captcha-row img{height:38px;cursor:pointer;border:1px solid #ddd;border-radius:4px;}

.msg-panel .icon{font-size:48px;}

.detail-left{width:420px;background:#fff;border-radius:8px;padding:16px;}

<script>
// AJAX 公共函数
function ajaxGet(url, cb, errMsg){
    fetch(url, {headers:{'X-Requested-With':'XMLHttpRequest'}})
        .then(function(r){ return r.json(); })
        .then(function(res){ cb(res); })
        .catch(function(){ alert(errMsg || '网络错误，请重试'); });
}
function ajaxPost(url, data, cb, errMsg){
    fetch(url, {method:'POST', headers:{'X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(data)})
        .then(function(r){ return r.json(); })
        .then(function(res){ cb(res); })
        .catch(function(){ alert(errMsg || '网络错误，请重试'); });
}
// 倒计时
function startCountdown(el, endTime, onEnd){
    var timer = setInterval(function(){
        var diff = endTime - Math.floor(Date.now()/1000);
        if(diff <= 0){
            el.textContent = '已结束';
            el.className = el.className.replace('countdown','') + ' countdown done';
            clearInterval(timer);
            if(onEnd) onEnd();
            return;
        }
        var d = Math.floor(diff/86400), h = Math.floor(diff%86400/3600), m = Math.floor(diff%3600/60), s = diff%60;
        function p(n){ return n<10 ? '0'+n : n; }
        var txt = '';
        if(d>0) txt += d + '天';
        txt += p(h) + ':' + p(m) + ':' + p(s);
        el.textContent = txt;
    }, 1000);
}
</script>

<script>
document.querySelectorAll('.cd').forEach(function(el){
    startCountdown(el, parseInt(el.getAttribute('data-end')));
});
</script>
